config:
  # Default state for all rules
  default: true

  # MD013: Disable line length rule
  MD013: false
  MD024: false
  MD038: false
  MD060: false

# The documentation website and the Markdown files around the code; the docs
# workflow's markdownlint job and `mise run docs-lint` both run this.
globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - ".git/**"
  - "vendor/**"
  - "dist/**"
  # Written by release-please.
  - CHANGELOG.md
  # The commit message check's dependencies.
  - ".github/commit-lint/**"
