name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - docs/**
      - "**.md"
      - .markdownlint-cli2.yaml
      - .mise.toml
      - .github/workflows/docs-website.yaml
      # The CLI reference is generated from the commands, and the API
      # reference serves the OpenAPI spec.
      - cmd/cli/**
      - internal/cli/**
      - pkg/swagger/swagger.json
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths: *paths

# Each job installs the tools it needs with mise-action's install_args. Without
# this, `mise run` installs every tool in .mise.toml first, which makes each
# job wait on (and fail with) downloads for tools it never runs.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned; go.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  md:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the markdownlint-cli2 pinned in .mise.toml, so local and CI
      # agree. markdownlint-cli2 is an npm package, and mise installs it with
      # the node .mise.toml pins, so node comes first.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node markdownlint-cli2

      - name: Lint docs
        run: mise run docs-lint

  build:
    name: Build (Docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs-build generates the CLI reference with go before building the
      # site.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go bun

      - name: Build
        run: mise run docs-build

      - name: Upload Artifacts
        # Only the deploy jobs consume this, and they run on push/dispatch.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: docs/.vuepress/dist
          retention-days: 1

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - build
      - md
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Download Artifacts for Website
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: ./dist

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-static-pages:
    name: Deploy to Static Pages
    runs-on: ubuntu-latest
    needs:
      - build
      - md
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Download Artifacts for Website
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: ./dist

      - name: Upload to Static Pages
        uses: SpechtLabs/StaticPages-Upload@ea3263677e20c44d61185a8318a06659d6e17fea # main
        with:
          endpoint: https://pages.specht-labs.de
          site-dir: dist/
