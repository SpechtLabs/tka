# API-related files
api:
  - changed-files:
      - any-glob-to-any-file:
          - 'api/**'
          - 'pkg/swagger/**'

# CLI-related files
cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/cli/**'
          - 'internal/cli/**'

# Server-related files
server:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/server/**'
          - 'pkg/service/**'

# Kubernetes/Operator-related files
kubernetes:
  - changed-files:
      - any-glob-to-any-file:
          - 'config/**'
          - 'pkg/operator/**'
          - 'pkg/client/k8s/**'

# Tailscale integration
tailscale:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/tshttp/**'

# Authentication/Security/Middleware
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/middleware/**'

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - '**/testdata/**'
          - '**/mock/**'

# Configuration and deployment
config:
  - changed-files:
      - any-glob-to-any-file:
          - 'config.yaml'
          - 'hack/**'

# Observability (metrics, logging)
observability:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/utils/o11y.go'
          - 'pkg/service/api/metrics.go'
          - 'pkg/operator/metrics.go'

# Models and utilities
models:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/models/**'
          - 'pkg/service/models/**'
          - 'internal/utils/**'

# Documentation (Markdown files or docs folders)
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

# Build, release, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Dockerfile'
          - '.goreleaser.yaml'
          - '.release-please-config.json'
          - '.release-please-manifest.json'
          - '.mise.toml'
          - '.golangci.yaml'
          - '.custom-gcl.yml'
          - '.pre-commit-config.yaml'
          - '.markdownlint-cli2.yaml'
          - '.yamllint.yaml'
          - '.editorconfig'
          - 'codecov.yml'
          - 'renovate.json'
          - 'go.mod'
          - 'go.sum'

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - '^feat'
      - '^feature'

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - '^fix'
      - '^bug'
