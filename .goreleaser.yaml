version: 2

project_name: tailscale-k8s-auth

builds:
  - id: server
    env: &env
      - CGO_ENABLED=0
    goos:
      - linux
    goarch: &goarch
      - arm64
      - amd64
    binary: ts-k8s-srv
    main: ./cmd/server
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: &ldflags
      - -s -w
      - -X=github.com/spechtlabs/tka/internal/cli/cmd.Version={{ .Version }}
      - -X=github.com/spechtlabs/tka/internal/cli/cmd.Commit={{ .Commit }}
      - -X=github.com/spechtlabs/tka/internal/cli/cmd.Date={{ .CommitDate }}

  - id: cli
    env: *env
    goos:
      - linux
      - windows
      - darwin
    goarch: *goarch
    binary: tka
    main: ./cmd/cli
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: *ldflags

# Docker image for server (multi-platform)
dockers:
  - id: oci-bundle
    use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    ids:
      - server
    image_templates:
      - ghcr.io/spechtlabs/tka:latest-amd64
      - ghcr.io/spechtlabs/tka:{{ .Tag }}-amd64
      - ghcr.io/spechtlabs/tka:v{{ .Major }}-amd64
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/amd64"
      - "--pull"

  - id: oci-bundle-arm64
    use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: arm64
    ids:
      - server
    image_templates:
      - ghcr.io/spechtlabs/tka:latest-arm64
      - ghcr.io/spechtlabs/tka:{{ .Tag }}-arm64
      - ghcr.io/spechtlabs/tka:v{{ .Major }}-arm64
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/arm64"
      - "--pull"

docker_manifests:
  - name_template: ghcr.io/spechtlabs/tka:latest
    image_templates:
      - ghcr.io/spechtlabs/tka:latest-amd64
      - ghcr.io/spechtlabs/tka:latest-arm64
    skip_push: auto

  - name_template: ghcr.io/spechtlabs/tka:{{ .Tag }}
    image_templates:
      - ghcr.io/spechtlabs/tka:{{ .Tag }}-amd64
      - ghcr.io/spechtlabs/tka:{{ .Tag }}-arm64
    skip_push: auto

  - name_template: ghcr.io/spechtlabs/tka:v{{ .Major }}
    image_templates:
      - ghcr.io/spechtlabs/tka:v{{ .Major }}-amd64
      - ghcr.io/spechtlabs/tka:v{{ .Major }}-arm64
    skip_push: auto

# Sign the image manifests with cosign (keyless, through the release
# workflow's OIDC token).
docker_signs:
  - id: oci-bundle-sign
    artifacts: manifests
    args:
      - sign
      - "${artifact}"
      - --yes

# A keyless cosign signature over checksums.txt, as a Sigstore bundle, covers
# every archive and package through its checksum. cosign 3 writes Sigstore
# bundles only, so the separate .sig and .pem files the release used to sign
# each binary with are gone.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

# Regular OS packages (for now only systemd based OSes)
nfpms:
  - id: cli
    package_name: tka
    ids:
      - cli
    maintainer: Cedric Specht <cedric@specht-labs.de>
    description: tka is a CLI tool for tailscale-k8s-auth, a tailnet-native Kubernetes access system. It allows users to securely log in to Kubernetes clusters using their Tailscale identity, receiving short-lived, auto-expiring kubeconfigs with scoped permissions.
    homepage: https://tka.specht-labs.de
    vendor: Specht Labs
    license: Apache 2.0
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin

archives:
  - id: server
    ids:
      - server
    name_template: 'tailscale-k8s-auth_server_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

  - id: cli
    ids:
      - cli
    name_template: "tka_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Publish to SpechtLabs/homebrew-tap using HOMEBREW_TAP_GITHUB_TOKEN, a
# repository or organization Actions secret with Contents: read and write
# access to the tap. The default GITHUB_TOKEN only has access to this repo.
homebrew_casks:
  - name: tka
    ids:
      - cli
    repository:
      owner: SpechtLabs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://tka.specht-labs.de/"
    description: "Tailnet-native Kubernetes access with short-lived kubeconfigs"
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@specht-labs.de
    # tka is not Apple-notarized. Remove quarantine from the installed binary
    # so Gatekeeper allows it to run, as with the other CLIs in the tap.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tka"]
          end

checksum:
  name_template: "checksums.txt"

# release-please writes the changelog and creates the GitHub release; GoReleaser
# only attaches the artifacts to it.
changelog:
  disable: true

release:
  github:
    owner: spechtlabs
    name: tka
  mode: keep-existing
